<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <button class="menu-icon" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 18 15">
          <path d="M0 0h18v3H0zM0 6h18v3H0zM0 12h18v3H0z"/>
        </svg>
        <span class="visually-hidden">Menu</span>
      </button>
      <div id="primary-navigation" class="trigger">
        {% for nav_page in site.pages %}
          {% if nav_page.skipmenu == null and nav_page.title %}
            <a class="page-link" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>
  </div>
</header>

<head>
    {% if site.github.build_revision %}
      {% assign asset_version = site.github.build_revision %}
    {% else %}
      {% assign asset_version = site.time | date: "%s" %}
    {% endif %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | absolute_url }}">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ asset_version }}">
    <script src="{{ "/js/navigation.js" | relative_url }}?v={{ asset_version }}" defer></script>
</head>
